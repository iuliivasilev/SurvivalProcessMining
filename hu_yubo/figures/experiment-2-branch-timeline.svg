 <title>Время от сигналов на трёх ветвях сети Петри до общего якоря</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Время от сигналов на трёх ветвях сети Петри до общего якоря</dc:title>
    <dc:description>В каждом цикле выбирается одна ветвь. Вероятности выбора X, Y и Z равны 25, 25 и 50 %. Сигналы появляются на 1-й, 4-й и 2-й секундах. До общего якоря A на 5-й секунде остаётся 4, 1 и 3 секунды соответственно. На 6-й секунде вероятности отказа на этих ветвях составляют 90, 70 и 20 %.</dc:description>
